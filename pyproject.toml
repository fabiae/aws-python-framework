[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-python-helper"
version = "0.1.0"
description = "AWS Python Helper"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "motor==3.3.2",
    "pymongo==4.6.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.packages.find.aws_python_framework]
where = ["aws_python_helper"]

[tool.setuptools.packages.find.tests]
where = ["tests"]

[tool.setuptools.packages.find.tests.aws_python_framework]
where = ["tests/aws_python_helper"]