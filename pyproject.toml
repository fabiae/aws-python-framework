[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-python-helper"
version = "0.3.0"
description = "AWS Python Helper Framework"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "motor==3.3.2",
    "pymongo==4.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aws_python_helper*"]