[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-python-helper"
version = "1.10.0"
description = "AWS Python Helper Framework"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "motor==3.3.2",
    "pymongo==4.6.1",
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

authors = [
    { name="Fabian Claros", email="neufabiae@gmail.com" }
]

license = "MIT"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

keywords = [
    "aws", "python", "framework", "helper", "mongodb", "sqs", "sns", "fargate", "lambda"
]

# Only needed by services running AUTH_STRATEGY=jwt.
[project.optional-dependencies]
jwt = ["PyJWT[crypto]>=2.9.0"]

[project.urls]
"Homepage" = "https://github.com/fabiae/aws-python-framework"
"Source Code" = "https://github.com/fabiae/aws-python-framework"
"Bug Tracker" = "https://github.com/fabiae/aws-python-framework/issues"
"Documentation" = "https://github.com/fabiae/aws-python-framework/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["aws_python_helper*"]